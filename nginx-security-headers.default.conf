# Fallback copy of the generated snippet, baked into the image.
#
# /docker-entrypoint.d/30-csp.sh overwrites this before nginx starts. It exists
# so the container still boots — with a policy, not without one — if that script
# is skipped, as it would be by an orchestrator that overrides the entrypoint.
#
# The origins here are the local-development defaults. A deployment that reaches
# a real API or a real bucket must set API_ORIGIN and STORAGE_ORIGIN so the
# script can regenerate this; a mismatch shows up as blocked requests in the
# browser console, never as a silently weaker policy.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: blob: http://localhost:9000; font-src 'self' data:; connect-src 'self' http://localhost:3000 ws://localhost:3000 http://localhost:9000 https://static.cloudflareinsights.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'self' http://localhost:9000; frame-src 'self' http://localhost:9000; base-uri 'none'; form-action 'self'; frame-ancestors 'none';" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
